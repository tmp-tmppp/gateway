# The one Gateway: an HTTP listener (the redirect to HTTPS and the ACME challenge) and, with TLS, an HTTPS listener.
# Routes may attach from the release namespace only. The GatewayClass comes from the official Traefik chart.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayClassName }}
  listeners:
    - name: http
      port: {{ .Values.listeners.httpPort }}
      protocol: HTTP
      hostname: {{ .Values.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- if .Values.tls.enabled }}
    - name: https
      port: {{ .Values.listeners.httpsPort }}
      protocol: HTTPS
      hostname: {{ .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ .Values.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
    {{- end }}
