{{- $svcNs := include "gateway.servicesNamespace" . }}
{{- if $svcNs }}
{{- $root := . }}
{{- $services := dict }}
{{- range $name, $route := .Values.routes }}
{{- if and (or (not (hasKey $route "enabled")) $route.enabled) (ne $route.backend "self") }}
{{- $_ := set $services (index $root.Values.backends $route.backend).service true }}
{{- end }}
{{- end }}
# The routes live in the release namespace and name Services in another one: that namespace has to allow it, one
# Service at a time (Gateway API ReferenceGrant). Nothing else in the namespace becomes reachable from a route.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "gateway.fullname" . }}-routes
  namespace: {{ $svcNs }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    {{- range $service, $_ := $services }}
    - group: ""
      kind: Service
      name: {{ $service }}
    {{- end }}
{{- end }}
